name: Build and deploy

# Rebuild daily from Supabase, plus on push, on demand, and whenever a
# reporter publishes a result (the trigger-rebuild Edge Function calls
# workflow_dispatch). The build validates before rendering: any data error
# exits non-zero, the job fails, and the deploy job never runs — production
# stays untouched.
#
# The daily cron is now a backstop rather than the main path: it catches
# anything a missed rebuild trigger left unbuilt.
on:
  schedule:
    - cron: "7 5 * * *"  # daily 05:07 UTC (:07 to dodge the on-the-hour cron rush)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # the build commits the data/canonical/ snapshot back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build site (fetch -> validate -> snapshot -> render)
        # SUPABASE IS THE SOURCE OF TRUTH. DATASET_SOURCE=supabase reads the
        # Postgres tables and rebuilds the identical CSV text the spreadsheet
        # used to publish, so every downstream step — validate.py, the parsers,
        # standings, every renderer — is unchanged. Set DATASET_SOURCE=sheets
        # to fall back to the (deprecated) spreadsheet in an emergency.
        #
        # SUPABASE_SECRET_KEY is required, not optional: `reporters` has no
        # public read policy, and reading it with the publishable key would
        # return an empty list rather than an error — an empty tab in the
        # snapshot, indistinguishable from every reporter having been deleted.
        # src/source_supabase.py refuses to build rather than allow that.
        #
        # SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are additionally written into
        # docs/report/config.js so the reporter app knows its endpoint. The
        # publishable key is designed to be public and is served to browsers at
        # /report/config.js anyway. build.py refuses to build if the
        # publishable slot holds something that looks like a secret key.
        env:
          DATASET_SOURCE: supabase
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python build.py
      - name: Commit data snapshot
        # data/canonical/ is the audit log of every data change and the
        # baseline for the validator's deletion-drift check. Only commits
        # when the sheet actually changed. GITHUB_TOKEN pushes don't
        # retrigger workflows, so this can't loop.
        #
        # --autostash is required: the build regenerates tracked docs/, so the
        # tree is always dirty here and a plain rebase would abort (exit 128).
        # The stash pops afterwards, leaving docs/ fresh for the artifact upload.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/canonical
          if ! git diff --cached --quiet; then
            git commit -m "data snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
