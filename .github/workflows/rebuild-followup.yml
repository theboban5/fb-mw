name: Rebuild follow-up

# Catches a result published while a build was already running.
#
# claim_rebuild debounces on a 60-second cooldown: a publish inside that window
# does not dispatch a build, it sets rebuild_state.pending. Usually the build
# already on its way reads the database late enough to include the change
# anyway — but not always, and when it does not, the result sits unbuilt until
# the 05:07 UTC cron. See 0011_consume_rebuild_pending.sql for the incident
# that motivated this.
#
# WHY THIS IS ITS OWN WORKFLOW, AND NOT A LAST STEP OF "Build and deploy".
# That workflow declares `concurrency: group: pages, cancel-in-progress: true`.
# A run dispatched from inside a run of the same workflow joins that group and
# cancels the run that dispatched it — the deploy would be fine, having already
# finished, but the run would be reported as cancelled and a genuinely failed
# deploy would become hard to spot among self-inflicted cancellations.
# `workflow_run` fires only after the triggering run has COMPLETED, so there is
# nothing left in the group to cancel.
#
# WHY THIS DOES NOT LOOP, TWICE OVER. consume_rebuild_pending() clears the flag
# in the same statement that reports it, so a follow-up would find nothing
# pending unless something new was published meanwhile. GitHub then enforces
# the same thing independently — see the chain depth note below.
#
# workflow_dispatch is one of the two events GitHub still delivers when fired
# with the default GITHUB_TOKEN (repository_dispatch is the other), so this
# does not need a PAT to dispatch a build.
#
# CHAIN DEPTH IS EXACTLY ONE, AND THAT IS A REAL LIMIT, NOT A CHOICE.
# A run created by GITHUB_TOKEN does not emit events that start further runs —
# the recursion guard. workflow_dispatch is excepted, so the build below IS
# dispatched; but that build's completion emits no workflow_run, so no
# follow-up runs after it. Measured on 2026-08-16:
#
#   09:30:48  Build and deploy  (push)              -> follow-up fired
#   09:26:58  Build and deploy  (dispatch, user PAT)-> follow-up fired
#   09:32:01  Build and deploy  (dispatch, this job)-> NO follow-up
#
# So one follow-up build per real build, which covers the case this exists
# for: a result published while a build was running. It does NOT cover a
# result published while the FOLLOW-UP build is running — that sets pending
# again with no third build to consume it, and waits for the next publish
# (whose own build includes it anyway) or the 05:07 cron.
#
# Closing that tail would mean dispatching with a PAT instead of GITHUB_TOKEN,
# or making this job poll the build it started and re-check. Neither is worth
# it for a window of roughly half a minute at the very end of a reporting
# session; the cron remains the honest backstop for it.

on:
  workflow_run:
    workflows: ["Build and deploy"]
    types: [completed]

permissions:
  actions: write        # to dispatch "Build and deploy"

jobs:
  followup:
    # A failed build published nothing, so the flag must stay set for the next
    # attempt rather than being consumed by a run that shipped no data.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch another build if a report landed mid-build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          # gh resolves the repo from the git remote, and this job deliberately
          # does not check out — there is nothing here to build. Name it.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ORDER MATTERS, AND IT IS: LOOK, DISPATCH, ONLY THEN CLEAR.
          #
          # Consuming first is the obvious way round and it is wrong. It was
          # written that way, the dispatch failed on its first live run, and
          # the flag had already been cleared — so the signal that a result
          # was unbuilt had been destroyed by the very job meant to act on it,
          # which is a worse outcome than the gap this workflow exists to
          # close.
          #
          # This order fails safe instead. Anything that goes wrong before the
          # clear — a dispatch error, a runner dying, the API refusing — leaves
          # pending set, and the next successful deploy tries again. The cost
          # of a failure is one late build; the cost of the other order was a
          # result that never appeared.
          #
          # The look-then-clear window is not a race worth closing: a publish
          # landing inside it sets pending again, but the build dispatched a
          # moment earlier reads the database tens of seconds later and picks
          # it up regardless. Clearing it is correct, not lossy.
          #
          # The secret key is required for both calls: rebuild_state is
          # revoked from anon and authenticated, and EXECUTE on the function
          # is service_role only.
          auth=(-H "apikey: ${SUPABASE_SECRET_KEY}"
                -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"
                -H "Content-Type: application/json")

          pending=$(curl -fsS "${SUPABASE_URL}/rest/v1/rebuild_state?select=pending" \
            "${auth[@]}" -H "Accept: application/vnd.pgrst.object+json" | jq -r .pending)
          echo "pending -> ${pending}"

          if [ "${pending}" != "true" ]; then
            echo "Nothing pending. The last build is current."
            exit 0
          fi

          echo "A report landed while the last build was running; rebuilding."
          gh workflow run "Build and deploy" --ref main

          # Dispatched. Now it is safe to clear the flag and book the dispatch,
          # which also restarts the cooldown so a reporter publishing at this
          # moment is debounced against real state.
          consumed=$(curl -fsS -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/consume_rebuild_pending" \
            "${auth[@]}" -d '{}')
          echo "consume_rebuild_pending -> ${consumed}"
