<script>
  /* Club hubs link in with a #club-team-{code} fragment so the right row
     can be highlighted (see hubs.py). Strip the hash immediately, before
     the browser gets to it, so the page doesn't jump past the banner to
     scroll the row into view — the row is highlighted via JS instead
     (see the script at the end of the hub's content). */
  (function(){
    var h = location.hash;
    if (h.indexOf('#club-team-') === 0) {
      window.__clubTeamTarget = h.slice(1);
      history.replaceState(null, '', location.pathname + location.search);
    }
  })();
</script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RCV8V3DEKV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RCV8V3DEKV');
</script>
</head>
<body>

{{BACK_LINK}}

{{CONTENT}}
</main>
{{FOOTER}}
<script>
(function(){
  var pager=document.querySelector('.v2-content [data-md-pager]');
  if(!pager) return;
  var groups=document.querySelectorAll('.v2-content .v2-md-group');
  var chips=[].slice.call(pager.querySelectorAll('[data-md-chip]'));
  if(chips.length<2) return; // single matchday: leave full view, pager hidden
  var mds=chips.map(function(c){return +c.dataset.mdChip;}).sort(function(a,b){return a-b;});
  var prev=pager.querySelector('[data-md-prev]');
  var next=pager.querySelector('[data-md-next]');
  var idx;
  function select(i){
    idx=Math.max(0,Math.min(mds.length-1,i));
    var md=mds[idx];
    groups.forEach(function(g){g.hidden=(+g.dataset.md!==md);});
    chips.forEach(function(c){
      var on=(+c.dataset.mdChip===md);
      c.classList.toggle('active',on);
      if(on){c.setAttribute('aria-current','true');c.scrollIntoView({inline:'center',block:'nearest'});}
      else{c.removeAttribute('aria-current');}
    });
    prev.disabled=(idx<=0);
    next.disabled=(idx>=mds.length-1);
  }
  chips.forEach(function(c){c.addEventListener('click',function(){select(mds.indexOf(+c.dataset.mdChip));});});
  prev.addEventListener('click',function(){select(idx-1);});
  next.addEventListener('click',function(){select(idx+1);});
  var di=mds.indexOf(+pager.dataset.mdDefault);
  pager.hidden=false;
  select(di>=0?di:mds.length-1); // open on the live edge (next unplayed round)
})();

/* The cluster filter on a standings page. Same bargain as the pager above:
   it ships hidden, this reveals it, and with JS off every cluster shows
   under its own heading — a longer page, not a broken one. Opens on "All"
   because no cluster is the one a reader is presumed to have come for. */
(function(){
  var pager=document.querySelector('.v2-content [data-grp-pager]');
  if(!pager) return;
  var sections=[].slice.call(document.querySelectorAll('.v2-content .v2-grp'));
  var chips=[].slice.call(pager.querySelectorAll('[data-grp-chip]'));
  if(sections.length<2) return; // one cluster is just a table
  function select(chip){
    var want=chip.dataset.grpChip;
    sections.forEach(function(s){s.hidden=(want!=='' && s.dataset.grp!==want);});
    chips.forEach(function(c){
      var on=(c===chip);
      c.classList.toggle('active',on);
      if(on){c.setAttribute('aria-current','true');}
      else{c.removeAttribute('aria-current');}
    });
  }
  chips.forEach(function(c){c.addEventListener('click',function(){select(c);});});
  pager.hidden=false;
  select(chips[0]);
})();
</script>
</body>
</html>
